name: 🚀 Submit an App Kit
description: Share an app you built with Taskade Genesis to be featured in our list of clone-ready App Kits
title: "[App Kit]: "
labels: ["app-kit", "community"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not paste a password, an API key or a token, an email address or phone number, a private workspace or project link, or customer data. For anything about your account, billing or a security problem, use the links on the previous page.
  - type: markdown
    attributes:
      value: |
        Built something with [Taskade Genesis](https://www.taskade.com/ai/apps)? Share it and we may feature it in our list of [clone-ready App Kits](https://github.com/taskade/taskade/blob/main/docs/genesis/app-kits.md), with credit and a link back to you.
  - type: input
    id: name
    attributes:
      label: App name
      placeholder: e.g. Freelance Invoice Tracker
    validations:
      required: true
  - type: input
    id: share_link
    attributes:
      label: Public share link
      description: The public share link of your app. Anyone must be able to open it without signing in. Never a link to a workspace or a project.
      placeholder: https://www.taskade.com/share/apps/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do? (one line, outcome-first)
      placeholder: e.g. Turns billable hours into branded invoices and tracks who has paid.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Sales
        - Customer support
        - Marketing
        - Operations
        - Finance
        - Personal productivity
        - Other
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Credit (your name / handle / site)
      description: How should we credit you if we feature it?
      placeholder: e.g. @yourhandle
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This app is mine to share and the link is public.
          required: true
        - label: I checked that this issue holds no private data.
          required: true
