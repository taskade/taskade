name: 💡 Ask for a feature
description: Tell us what you want Taskade to do for you.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not paste a password, an API key or a token, an email address or phone number, a private workspace or project link, or customer data. For anything about your account, billing or a security problem, use the links on the previous page.

        A screenshot is welcome only if it shows no private data.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Tell us about the task or the goal, not the button you want.
      placeholder: Every Monday I copy the tasks that are late into a report for my team.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      placeholder: I filter the board by due date and copy each task by hand.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome do you want?
      placeholder: My team gets a list of late tasks every Monday without my help.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this issue holds no private data.
          required: true
