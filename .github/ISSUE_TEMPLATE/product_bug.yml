name: 🐞 Something is broken in Taskade
description: Tell us about a problem in the Taskade app, a Taskade Genesis app, an agent, or an automation.
title: "[Bug]: "
labels: ["bug"]
assignees: ["deanzaka"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not paste a password, an API key or a token, an email address or phone number, a private workspace or project link, or customer data. For anything about your account, billing or a security problem, use the links on the previous page.

        A screenshot is welcome only if it shows no private data. Crop or blur names, email addresses and workspace content before you add it.
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Write the steps in order.
      placeholder: |
        1. I opened my app.
        2. I clicked Publish.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The app publishes and I get a share link.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Tell us what you saw. Copy the text of an error message if you see one.
      placeholder: The spinner turns and never stops.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Taskade?
      description: For a question about your own bill or account, use the contact link on the previous page.
      options:
        - Taskade Genesis apps
        - AI agents
        - Automations and integrations
        - Projects and views
        - Sharing and publishing
        - Billing page display
        - Mobile app
        - Desktop app
        - MCP server and AI clients
        - Other
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Your plan
      options:
        - Free
        - Starter
        - Pro
        - Business
        - Max
        - Enterprise
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      description: Pick all that apply.
      multiple: true
      options:
        - Web in Chrome
        - Web in Safari
        - Web in Firefox
        - Web in Edge
        - Web in another browser
        - iOS app
        - Android app
        - Mac app
        - Windows app
    validations:
      required: true
  - type: input
    id: public_link
    attributes:
      label: Public link to a published app (optional)
      description: Only a link that anyone can open without signing in, for example a link that starts with https://www.taskade.com/share/apps/. Never a link to a workspace or a project.
      placeholder: https://www.taskade.com/share/apps/...
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this issue holds no private data.
          required: true
