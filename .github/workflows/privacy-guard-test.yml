# Runs the tests of the privacy guard, the triage rules and the lifecycle rules.
name: Privacy guard tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/privacy-guard.yml"
      - ".github/workflows/privacy-guard-test.yml"
      - ".github/workflows/triage.yml"
      - ".github/workflows/lifecycle.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/privacy-guard.yml"
      - ".github/workflows/privacy-guard-test.yml"
      - ".github/workflows/triage.yml"
      - ".github/workflows/lifecycle.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"

permissions:
  contents: read

jobs:
  test:
    name: Scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run the tests
        run: node --test '.github/scripts/*.test.mjs'
